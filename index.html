<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback del equipo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#1f2328; --muted:#6b7078; --line:#e4e1d8;
    --accent:#2f6f5e; --accent-soft:#e3efe9; --warm:#b5651d; --warm-soft:#f8ecdf;
    --danger:#a33a3a; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  header h1{font-size:20px;margin:0}
  header .who{font-size:14px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  h2{font-size:18px;margin:0 0 10px}
  h3{font-size:15px;margin:0 0 6px}
  p{margin:0 0 10px}
  .muted{color:var(--muted);font-size:14px}
  label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
  .hint{font-size:13px;color:var(--muted);margin-bottom:6px}
  input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  textarea{min-height:90px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .count{font-size:12px;color:var(--muted);text-align:right}
  .count.bad{color:var(--danger)}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:600}
  button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.link{background:none;color:var(--accent);padding:4px 6px;font-weight:600}
  button.small{padding:6px 10px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{background:transparent;color:var(--muted);border:1px solid transparent}
  .tabs button.on{background:var(--card);color:var(--ink);border-color:var(--line)}
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .person{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);font-weight:500}
  .person.done{background:var(--accent-soft);cursor:default}
  .person .tick{color:var(--accent);font-weight:700}
  .note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
  .note.warm{background:var(--warm-soft)}
  .err{color:var(--danger);font-size:14px;margin-top:8px;min-height:1em}
  .fb{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
  .fb .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;margin-bottom:6px}
  .tag.keep{background:var(--accent-soft);color:var(--accent)}
  .tag.try{background:var(--warm-soft);color:var(--warm)}
  .tag.kudos{background:#ece8f6;color:#5b4a99}
  .fb blockquote{margin:0 0 10px;padding:0;white-space:pre-wrap}
  .fb.hidden{opacity:.55}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  td.num{text-align:center}
  .low{color:var(--danger);font-weight:700}
  .ok{color:var(--accent);font-weight:700}
  .center{text-align:center}
  .tablewrap{overflow-x:auto}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
  .hide{display:none!important}
  .comp{margin-top:18px}
  .comp h3{font-size:15px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .q{padding:10px 0;border-bottom:1px dashed var(--line)}
  .q:last-child{border-bottom:0}
  .q p{font-size:14px;margin:0 0 8px}
  .scale{display:flex;gap:6px;flex-wrap:wrap}
  .scale button{background:#fff;color:var(--ink);border:1px solid var(--line);padding:6px 0;width:40px;font-weight:600}
  .scale button.ns{width:auto;padding:6px 10px;font-weight:500;color:var(--muted);font-size:13px}
  .scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .scale button.ns.on{background:#eceae4;color:var(--ink);border-color:#d6d3ca}
  .legend{font-size:12px;color:var(--muted);margin-top:6px}
  .bar{height:8px;background:#eceae4;border-radius:99px;overflow:hidden;flex:1;min-width:60px}
  .bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
  .stat{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
  .stat .lbl{flex:2}
  .stat .val{width:34px;text-align:right;font-weight:700}
  details summary{cursor:pointer;list-style:none}
  details summary::-webkit-details-marker{display:none}
  .chips{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .chip{font-size:14px;padding:8px 12px;border-radius:10px}
  .chip.c-top{background:var(--accent-soft)}
  .chip.c-low{background:var(--warm-soft)}
  .sticky{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const SB_URL = 'https://xefnuudfxyisaogadnmp.supabase.co';
const SB_KEY = 'sb_publishable_aZZqdtt-x6gjEmF1kxW0ng_lDATB4I7';
const LIM = { valora:[0,600], probar:[0,400] };

// 15 afirmaciones en 5 competencias (el orden importa: se guarda por posición)
const COMPETENCIAS = [
  { nombre:'Compañerismo', icono:'🤝', preguntas:[
    'Cuando alguien del equipo se atasca, se implica para ayudarle aunque no sea su tarea.',
    'Si hace falta, hace un esfuerzo extra (quedarse un rato más, cubrir a alguien) para sacar adelante el trabajo del equipo.',
    'Comparte lo que sabe y ayuda a que los demás aprendan.' ]},
  { nombre:'Orientación al cliente', icono:'🎯', preguntas:[
    'Se esfuerza por entender lo que el cliente necesita de verdad.',
    'Hace todo lo posible por dejar al cliente satisfecho, también cuando la cosa se complica.',
    'Transmite una imagen profesional del equipo ante el cliente.' ]},
  { nombre:'Compromiso y responsabilidad', icono:'📌', preguntas:[
    'Cumple lo que se compromete a hacer, en plazo y en las horas previstas.',
    'Avisa a tiempo cuando algo se va a retrasar o complicar.',
    'Asume sus errores y se implica en solucionarlos.' ]},
  { nombre:'Comunicación y actitud', icono:'💬', preguntas:[
    'Se explica con claridad y es fácil entenderse con él o ella.',
    'Mantiene una actitud positiva en momentos de presión.',
    'Se adapta bien a los cambios de prioridades o de requisitos.' ]},
  { nombre:'Calidad del trabajo', icono:'🛠️', preguntas:[
    'Entrega un trabajo cuidado, que no hay que rehacer.',
    'Busca soluciones por su cuenta antes de quedarse bloqueado.',
    'Tiene inquietud por aprender y mejorar profesionalmente.' ]}
];
const PREGUNTAS = COMPETENCIAS.flatMap((c, ci) => c.preguntas.map(t => ({ t, ci })));
const ESCALA = ['Nada de acuerdo','Poco de acuerdo','Neutral','Bastante de acuerdo','Totalmente de acuerdo'];

const ERRORES = {
  SESION_INVALIDA:'Tu sesión ha caducado. Vuelve a entrar.',
  LOGIN_INCORRECTO:'Nombre o contraseña incorrectos.',
  PASS_CORTA:'La contraseña debe tener al menos 4 caracteres.',
  INVITACION_USADA:'Este enlace ya se usó. Entra con tu nombre y contraseña.',
  RONDA_CERRADA:'La ronda de feedback ya está cerrada.',
  YA_ENVIADO:'Ya le has dejado feedback a esta persona.',
  A_TI_MISMO:'No puedes dejarte feedback a ti mismo.',
  NO_ADMIN:'No tienes permisos de administración.',
  VACIO:'Responde al menos una pregunta o escribe algo.',
  TEXTO_LARGO:'Uno de los textos es demasiado largo.',
  DATOS_INVALIDOS:'Hay algún dato no válido. Recarga la página e inténtalo de nuevo.'
};

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(){ try{ return localStorage.getItem('fb_token'); }catch{ return null; } },
  set(t){ try{ t ? localStorage.setItem('fb_token', t) : localStorage.removeItem('fb_token'); }catch{} }
};
let TOKEN = store.get();
let YO = null;
let TAB = 'dar';

async function rpc(fn, args = {}){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:'POST',
    headers:{ apikey:SB_KEY, 'Content-Type':'application/json' },
    body:JSON.stringify(args)
  });
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : null;
  if(!r.ok){
    const code = (data && data.message) || 'ERROR';
    if(code === 'SESION_INVALIDA'){ store.set(null); TOKEN = null; }
    throw new Error(ERRORES[code] || 'Ha ocurrido un error. Inténtalo de nuevo.');
  }
  return data;
}

function counter(el, [min,max]){
  const c = el.parentElement.querySelector('.count');
  const n = el.value.trim().length;
  c.textContent = `${n}/${max}`;
  c.classList.toggle('bad', n > max || (min && n > 0 && n < min));
}

// ---------- arranque ----------
async function init(){
  const code = new URLSearchParams(location.search).get('i');
  if(code && !TOKEN) return pantallaInvitacion(code);
  if(!TOKEN) return pantallaLogin();
  try{
    YO = await rpc('fb_yo', { p_token:TOKEN });
    if(code) history.replaceState(null, '', location.pathname);
    pantallaPrincipal();
  }catch(e){ pantallaLogin(e.message); }
}

// ---------- invitación (primera vez) ----------
async function pantallaInvitacion(code){
  const app = $('#app');
  let info = null;
  try{ info = await rpc('fb_info_invitacion', { p_code:code }); }catch{}
  if(!info){
    history.replaceState(null, '', location.pathname);
    return pantallaLogin('Este enlace no es válido. Pide uno nuevo a tu responsable.');
  }
  if(info.reclamada){
    history.replaceState(null, '', location.pathname);
    return pantallaLogin('Ya creaste tu contraseña con este enlace. Entra con tu nombre.');
  }
  app.innerHTML = `
    <header><h1>💬 Feedback del equipo</h1></header>
    <div class="card">
      <h2>Hola, ${esc(info.nombre)} 👋</h2>
      <p>Elige una contraseña para entrar. A partir de ahora entrarás eligiendo tu nombre y esta contraseña.</p>
      <label for="p1">Contraseña</label>
      <input id="p1" type="password" autocomplete="new-password">
      <label for="p2">Repítela</label>
      <input id="p2" type="password" autocomplete="new-password">
      <div class="err" id="err"></div>
      <button id="go">Crear y entrar</button>
    </div>`;
  $('#go').onclick = async () => {
    const p1 = $('#p1').value, p2 = $('#p2').value;
    if(p1 !== p2) return $('#err').textContent = 'Las contraseñas no coinciden.';
    try{
      TOKEN = await rpc('fb_reclamar', { p_code:code, p_pass:p1 });
      store.set(TOKEN);
      history.replaceState(null, '', location.pathname);
      init();
    }catch(e){ $('#err').textContent = e.message; }
  };
}

// ---------- login ----------
async function pantallaLogin(msg = ''){
  const app = $('#app');
  let nombres = [];
  try{ nombres = await rpc('fb_lista_nombres'); }catch{}
  app.innerHTML = `
    <header><h1>💬 Feedback del equipo</h1></header>
    <div class="card">
      <h2>Entrar</h2>
      <label for="nom">Tu nombre</label>
      <select id="nom"><option value="">Elige tu nombre…</option>
        ${nombres.map(n => `<option value="${n.id}">${esc(n.nombre)}</option>`).join('')}
      </select>
      <label for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="current-password">
      <div class="err" id="err">${esc(msg)}</div>
      <button id="go">Entrar</button>
      <p class="muted" style="margin-top:14px">¿No apareces en la lista? Usa primero el enlace personal que te ha enviado tu responsable.</p>
    </div>`;
  const go = async () => {
    const id = $('#nom').value, pw = $('#pw').value;
    if(!id || !pw) return $('#err').textContent = 'Elige tu nombre y escribe tu contraseña.';
    $('#go').disabled = true;
    try{
      TOKEN = await rpc('fb_login', { p_persona:id, p_pass:pw });
      store.set(TOKEN);
      init();
    }catch(e){ $('#err').textContent = e.message; $('#go').disabled = false; }
  };
  $('#go').onclick = go;
  $('#pw').onkeydown = e => { if(e.key === 'Enter') go(); };
}

async function salir(){
  try{ await rpc('fb_logout', { p_token:TOKEN }); }catch{}
  store.set(null); TOKEN = null; YO = null;
  pantallaLogin();
}

// ---------- principal ----------
function pantallaPrincipal(){
  const app = $('#app');
  app.innerHTML = `
    <header>
      <div><h1>💬 ${esc(YO.ronda)}</h1><div class="who">${esc(YO.nombre)}</div></div>
      <button class="sec small" id="salir">Salir</button>
    </header>
    <nav class="tabs">
      <button data-t="dar">Dar feedback</button>
      <button data-t="mio">Mi feedback</button>
      ${YO.es_admin ? '<button data-t="admin">Administración</button>' : ''}
      <button data-t="como">Cómo funciona</button>
    </nav>
    <div id="view"></div>`;
  $('#salir').onclick = salir;
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { TAB = b.dataset.t; pintarTab(); });
  pintarTab();
}

function pintarTab(){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === TAB));
  ({ dar:vistaDar, mio:vistaMio, admin:vistaAdmin, como:vistaComo }[TAB] || vistaDar)();
}

const estadoTexto = e => ({
  abierta:'La ronda está abierta: puedes dejar feedback.',
  cerrada:'La ronda está cerrada. Los feedbacks se publicarán en breve.',
  publicada:'Los feedbacks ya están publicados. Mira la pestaña «Mi feedback».'
}[e]);

// ---------- dar feedback ----------
async function vistaDar(){
  const v = $('#view');
  v.innerHTML = '<p class="muted">Cargando…</p>';
  let gente = [];
  try{ gente = await rpc('fb_companeros', { p_token:TOKEN }); }
  catch(e){ return manejarError(e); }
  const hechos = gente.filter(g => g.enviado).length;
  v.innerHTML = `
    <div class="note">${estadoTexto(YO.estado)}</div>
    <div class="card">
      <h2>¿A quién quieres dejar feedback?</h2>
      <p class="muted">Elige solo a personas con las que hayas trabajado; se tarda un par de minutos por persona. Es anónimo: nadie, tampoco tu responsable, sabrá qué has escrito tú. Llevas <b>${hechos}</b>.</p>
      <div class="people">
        ${gente.map(g => `
          <button class="person ${g.enviado ? 'done' : ''}" data-id="${g.id}" data-n="${esc(g.nombre)}" ${g.enviado || YO.estado !== 'abierta' ? 'disabled' : ''}>
            <span>${esc(g.nombre)}</span>${g.enviado ? '<span class="tick">✓ enviado</span>' : ''}
          </button>`).join('')}
      </div>
    </div>`;
  v.querySelectorAll('.person:not(.done)').forEach(b => b.onclick = () => formulario(b.dataset.id, b.dataset.n));
}

function formulario(id, nombre){
  const v = $('#view');
  const notas = new Array(15).fill(null);
  v.innerHTML = `
    <div class="card">
      <button class="link" id="volver">← Volver</button>
      <h2>Feedback para ${esc(nombre)}</h2>
      <p class="muted">Todo es opcional: contesta solo lo que hayas visto de verdad y deja el resto en «No sé». Basta con una respuesta para poder enviarlo.</p>
      ${COMPETENCIAS.map((c, ci) => `
        <div class="comp">
          <h3>${c.icono} ${esc(c.nombre)}</h3>
          ${c.preguntas.map((t, k) => {
            const i = ci * 3 + k;
            return `<div class="q" data-i="${i}">
              <p>${esc(t)}</p>
              <div class="scale">
                ${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}" title="${ESCALA[n-1]}">${n}</button>`).join('')}
                <button type="button" class="ns on" data-n="">No sé</button>
              </div>
            </div>`;
          }).join('')}
        </div>`).join('')}
      <div class="legend">1 = nada de acuerdo · 3 = neutral · 5 = totalmente de acuerdo</div>

      <div class="comp">
        <h3>✍️ Si quieres, escríbele algo</h3>
        <label>Lo que más valoro de trabajar contigo</label>
        <textarea id="va" maxlength="${LIM.valora[1]}" placeholder="Ej.: Cuando el cliente cambió el alcance, reorganizaste las tareas al momento y nadie se perdió."></textarea>
        <div class="count"></div>
        <label>Te propondría probar…</label>
        <div class="hint">Una sugerencia para crecer, escrita como propuesta y no como queja.</div>
        <textarea id="pr" maxlength="${LIM.probar[1]}" placeholder="Ej.: Compartir los avances antes de la entrega; así te podríamos echar una mano antes."></textarea>
        <div class="count"></div>
      </div>

      <div class="sticky">
        <div class="err" id="err"></div>
        <button id="rev">Revisar y enviar</button>
      </div>
    </div>`;
  $('#volver').onclick = vistaDar;
  v.querySelectorAll('.q').forEach(q => {
    const i = +q.dataset.i;
    q.querySelectorAll('.scale button').forEach(b => b.onclick = () => {
      const n = b.dataset.n ? +b.dataset.n : null;
      notas[i] = (notas[i] === n) ? null : n;   // volver a pulsar la misma nota la quita
      q.querySelectorAll('.scale button').forEach(x =>
        x.classList.toggle('on', (x.dataset.n ? +x.dataset.n : null) === notas[i]));
    });
  });
  [['#va',LIM.valora],['#pr',LIM.probar]].forEach(([s,l]) => { const el = $(s); el.oninput = () => counter(el,l); counter(el,l); });

  $('#rev').onclick = () => {
    const val = { notas:[...notas], va:$('#va').value.trim(), pr:$('#pr').value.trim() };
    if(!val.notas.some(n => n !== null) && !val.va && !val.pr)
      return $('#err').textContent = 'Responde al menos una pregunta o escribe algo.';
    $('#err').textContent = '';
    confirmar(id, nombre, val);
  };
}

function confirmar(id, nombre, val){
  const m = document.createElement('div');
  const contestadas = val.notas.filter(n => n !== null).length;
  m.className = 'modal';
  m.innerHTML = `
    <div class="card">
      <h2>¿Lo enviamos?</h2>
      <p class="muted">Una vez enviado <b>no se puede editar</b>, porque no se guarda quién lo escribió.</p>
      <p>Has valorado <b>${contestadas}</b> de 15 afirmaciones.</p>
      ${val.va ? `<div class="fb"><span class="tag keep">Lo que más valoro</span><blockquote>${esc(val.va)}</blockquote></div>` : ''}
      ${val.pr ? `<div class="fb"><span class="tag try">Te propondría probar</span><blockquote>${esc(val.pr)}</blockquote></div>` : ''}
      <div class="err" id="err2"></div>
      <div class="row"><button id="ok">Enviar</button><button class="sec" id="no">Seguir editando</button></div>
    </div>`;
  document.body.appendChild(m);
  m.querySelector('#no').onclick = () => m.remove();
  m.querySelector('#ok').onclick = async () => {
    m.querySelector('#ok').disabled = true;
    try{
      await rpc('fb_responder', { p_token:TOKEN, p_dest:id, p_p:val.notas, p_valora:val.va || null, p_probar:val.pr || null });
      m.remove();
      vistaDar();
    }catch(e){ m.querySelector('#err2').textContent = e.message; m.querySelector('#ok').disabled = false; }
  };
}

// ---------- mi feedback ----------
async function vistaMio(){
  const v = $('#view');
  v.innerHTML = '<p class="muted">Cargando…</p>';
  let r;
  try{ r = await rpc('fb_mis_feedbacks', { p_token:TOKEN }); }
  catch(e){ return manejarError(e); }

  if(r.estado === 'abierta' || r.estado === 'cerrada'){
    v.innerHTML = `<div class="card center">
      <h2>Aún no está publicado</h2>
      <p class="muted">Todos los feedbacks se publican a la vez cuando termina la ronda, para que nadie pueda deducir quién escribió qué.</p></div>`;
    return;
  }
  if(r.estado === 'insuficiente'){
    v.innerHTML = `<div class="card center">
      <h2>No hay suficientes respuestas</h2>
      <p class="muted">Para proteger el anonimato solo mostramos el feedback cuando lo han dejado al menos ${r.min} personas, y en tu caso no se ha llegado. No dice nada de ti: simplemente no ha participado suficiente gente.</p></div>`;
    return;
  }

  // Medias por afirmación (solo las que tienen respuestas suficientes) y por competencia
  const media = {};
  (r.preguntas || []).forEach(p => { if(p.media !== null) media[p.i - 1] = +p.media; });
  const comps = COMPETENCIAS.map((c, ci) => {
    const vals = [0,1,2].map(k => media[ci*3 + k]).filter(x => x !== undefined);
    return { ...c, ci, media: vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null };
  });
  const ranking = Object.entries(media).map(([i, m]) => ({ i:+i, m })).sort((a,b) => b.m - a.m);
  const fuertes = ranking.slice(0, 3);
  const crecer = ranking.length >= 5 ? ranking.slice(-2).reverse() : [];
  const fmt = n => n.toFixed(1).replace('.', ',');
  const barra = m => `<div class="bar"><span style="width:${(m/5)*100}%"></span></div>`;

  const textos = r.textos || [];
  const valora = textos.filter(t => t.tipo === 'valora');
  const probar = textos.filter(t => t.tipo === 'probar');

  v.innerHTML = `
    <div class="note">Han participado <b>${r.total}</b> compañeros. Nadie puede saber quién escribió qué. Léelo con calma: lo que aparece como «dónde crecer» son propuestas, no fallos.</div>

    ${ranking.length ? `
    <div class="card">
      <h2>Por competencias</h2>
      <p class="muted">Media de 1 a 5. Solo se muestran las afirmaciones que han contestado al menos ${r.min} personas.</p>
      ${comps.map(c => `
        <details>
          <summary class="stat"><span class="lbl">${c.icono} ${esc(c.nombre)}</span>
            ${c.media !== null ? `${barra(c.media)}<span class="val">${fmt(c.media)}</span>` : '<span class="muted">sin datos suficientes</span>'}
          </summary>
          ${c.preguntas.map((t, k) => { const m = media[c.ci*3 + k]; return `
            <div class="stat" style="padding-left:24px;font-size:13px"><span class="lbl">${esc(t)}</span>
              ${m !== undefined ? `${barra(m)}<span class="val">${fmt(m)}</span>` : '<span class="muted">—</span>'}
            </div>`; }).join('')}
        </details>`).join('')}
      <p class="muted" style="margin-top:8px">Toca una competencia para ver el detalle.</p>
    </div>

    <div class="card">
      <h2>💪 Tus puntos fuertes</h2>
      <div class="chips">${fuertes.map(f => `<div class="chip c-top">${esc(PREGUNTAS[f.i].t)} <b>${fmt(f.m)}</b></div>`).join('')}</div>
      ${crecer.length ? `
        <h2 style="margin-top:16px">🌱 Dónde podrías crecer</h2>
        <div class="chips">${crecer.map(f => `<div class="chip c-low">${esc(PREGUNTAS[f.i].t)} <b>${fmt(f.m)}</b></div>`).join('')}</div>` : ''}
    </div>` : ''}

    ${valora.length ? `<div class="card"><h2>Lo que más valoran de ti</h2><div id="lv"></div></div>` : ''}
    ${probar.length ? `<div class="card"><h2>Te proponen probar…</h2><div id="lp"></div></div>` : ''}
    ${!ranking.length && !textos.length ? '<div class="card"><p class="muted">No hay datos suficientes para mostrar.</p></div>' : ''}`;

  const pinta = t => `
    <div class="fb ${t.oculto ? 'hidden' : ''}" data-id="${t.id}">
      <blockquote>${t.oculto ? '<i class="muted">Comentario oculto</i>' : esc(t.texto)}</blockquote>
      <div class="row">
        <button class="small ${t.gracias ? '' : 'sec'}" data-a="gracias">${t.gracias ? '💚 Agradecido' : '💚 Dar las gracias'}</button>
        <button class="small sec" data-a="ocultar">${t.oculto ? 'Mostrar' : 'Ocultar'}</button>
      </div>
    </div>`;
  if(valora.length) $('#lv').innerHTML = valora.map(pinta).join('');
  if(probar.length) $('#lp').innerHTML = probar.map(pinta).join('');
  v.querySelectorAll('.fb button').forEach(b => b.onclick = async () => {
    const id = b.closest('.fb').dataset.id;
    const t = textos.find(x => x.id === id);
    const args = { p_token:TOKEN, p_id:id, p_oculto:null, p_gracias:null };
    if(b.dataset.a === 'gracias') args.p_gracias = !t.gracias; else args.p_oculto = !t.oculto;
    try{ await rpc('fb_marcar', args); vistaMio(); }catch(e){ manejarError(e); }
  });
}

// ---------- administración ----------
async function vistaAdmin(){
  const v = $('#view');
  v.innerHTML = '<p class="muted">Cargando…</p>';
  let r;
  try{ r = await rpc('fb_admin_resumen', { p_token:TOKEN }); }
  catch(e){ return manejarError(e); }
  const c = r.config, ps = r.personas;
  const base = location.origin + location.pathname;
  const activos = ps.filter(p => p.activo);
  const bajoMin = activos.filter(p => p.recibidos < c.min_feedbacks).length;

  v.innerHTML = `
    <div class="note warm">Aquí solo ves cifras. El contenido de los feedbacks no es visible para nadie salvo para quien los recibe.</div>
    <div class="card">
      <h2>Ronda</h2>
      <label for="rn">Nombre</label><input id="rn" value="${esc(c.ronda)}">
      <label for="es">Estado</label>
      <select id="es">
        <option value="abierta" ${c.estado==='abierta'?'selected':''}>Abierta: se puede escribir</option>
        <option value="cerrada" ${c.estado==='cerrada'?'selected':''}>Cerrada: no se escribe ni se publica</option>
        <option value="publicada" ${c.estado==='publicada'?'selected':''}>Publicada: cada uno ve lo suyo</option>
      </select>
      <label for="mn">Mínimo de feedbacks para mostrarlos</label>
      <input id="mn" type="number" min="1" max="10" value="${c.min_feedbacks}">
      <div class="err" id="errc"></div>
      <button id="gc">Guardar</button>
    </div>

    <div class="card">
      <h2>Personas (${activos.length})</h2>
      <p class="muted">${bajoMin} persona(s) por debajo del mínimo de ${c.min_feedbacks}. Copia el enlace de cada uno y envíaselo por privado; solo sirve para crear su contraseña.</p>
      <div class="tablewrap"><table>
        <thead><tr><th>Nombre</th><th class="center">Cuenta</th><th class="center">Ha dado</th><th class="center">Recibidos</th><th></th></tr></thead>
        <tbody>
        ${ps.map(p => `
          <tr style="${p.activo ? '' : 'opacity:.45'}" data-id="${p.id}" data-code="${p.invite_code}">
            <td>${esc(p.nombre)}${p.es_admin ? ' <span class="muted">(admin)</span>' : ''}</td>
            <td class="num">${p.reclamada ? '<span class="ok">✓</span>' : '—'}</td>
            <td class="num">${p.dados}</td>
            <td class="num ${p.recibidos < c.min_feedbacks ? 'low' : 'ok'}">${p.recibidos}</td>
            <td style="white-space:nowrap">
              ${!p.reclamada && p.activo ? '<button class="small" data-a="copiar">Copiar enlace</button>' : ''}
              ${p.reclamada ? '<button class="small sec" data-a="reset" title="Si ha olvidado la contraseña">Reiniciar</button>' : ''}
              ${p.es_admin ? '' : `<button class="small sec" data-a="${p.activo ? 'desactivar' : 'activar'}">${p.activo ? 'Quitar' : 'Reactivar'}</button>`}
            </td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>

    <div class="card">
      <h2>Añadir personas</h2>
      <p class="muted">Un nombre por línea, tal y como queráis que aparezca.</p>
      <textarea id="nuevos" placeholder="Nombre Apellido&#10;Nombre Apellido"></textarea>
      <div class="err" id="erra"></div>
      <button id="add">Añadir</button>
    </div>`;

  $('#gc').onclick = async () => {
    const estado = $('#es').value;
    if(estado === 'publicada' && c.estado !== 'publicada' &&
       !confirm('Al publicar, cada persona con al menos ' + $('#mn').value + ' feedbacks podrá verlos. ¿Publicar ahora?')) return;
    try{
      await rpc('fb_admin_config', { p_token:TOKEN, p_ronda:$('#rn').value, p_estado:estado, p_min:+$('#mn').value });
      YO = await rpc('fb_yo', { p_token:TOKEN });
      pantallaPrincipal();
    }catch(e){ $('#errc').textContent = e.message; }
  };
  $('#add').onclick = async () => {
    try{
      const n = await rpc('fb_admin_add', { p_token:TOKEN, p_nombres:$('#nuevos').value });
      $('#erra').textContent = '';
      if(!n) $('#erra').textContent = 'No se añadió nadie (¿nombres repetidos o vacíos?).';
      else vistaAdmin();
    }catch(e){ $('#erra').textContent = e.message; }
  };
  v.querySelectorAll('tbody button').forEach(b => b.onclick = async () => {
    const tr = b.closest('tr'), a = b.dataset.a;
    if(a === 'copiar'){
      const link = `${base}?i=${tr.dataset.code}`;
      try{ await navigator.clipboard.writeText(link); b.textContent = '¡Copiado!'; }
      catch{ prompt('Copia este enlace:', link); }
      return;
    }
    if(a === 'reset' && !confirm('Se borrará su contraseña y se generará un enlace nuevo. ¿Continuar?')) return;
    try{ await rpc('fb_admin_persona', { p_token:TOKEN, p_id:tr.dataset.id, p_accion:a }); vistaAdmin(); }
    catch(e){ alert(e.message); }
  });
}

// ---------- cómo funciona ----------
function vistaComo(){
  $('#view').innerHTML = `
    <div class="card">
      <h2>Cómo funciona</h2>
      <h3>Para qué sirve</h3>
      <p>Para que cada uno sepa qué ven en él los compañeros con los que trabaja: lo que más valoran y algo que le ayudaría a crecer. Es para tu desarrollo; nadie más que tú lee tu feedback.</p>
      <h3>Qué se escribe</h3>
      <p>Por cada compañero, 15 afirmaciones agrupadas en 5 competencias (compañerismo, cliente, compromiso, comunicación y calidad) que se puntúan del 1 al 5. Además, dos campos de texto: <b>lo que más valoras</b> y <b>algo que le propondrías probar</b>. Todo es opcional; contesta solo lo que hayas visto.</p>
      <h3>Anonimato</h3>
      <p>No se guarda quién escribió cada respuesta ni cuándo. Solo se apunta que ya le has escrito a esa persona, para que no se repita. Por eso no se puede editar después de enviarlo. Los dos textos se guardan por separado, así que tampoco se puede saber qué «valora» y qué «probar» escribió la misma persona.</p>
      <p>Todo se publica de golpe al cerrar la ronda y solo si una persona tiene al menos ${YO.min} feedbacks. Las notas se ven como media y solo en las afirmaciones que han contestado al menos ${YO.min} personas, nunca sueltas.</p>
      <h3>Si algo no te gusta</h3>
      <p>Puedes ocultar cualquier comentario que recibas y dar las gracias, de forma anónima, a los que te hayan servido.</p>
    </div>`;
}

function manejarError(e){
  if(!TOKEN) return pantallaLogin(e.message);
  $('#view').innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p></div>`;
}

init();
</script>
</body>
</html>
